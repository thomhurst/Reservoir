name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  # Publishing the draft release that release-draft.yml keeps for main runs every gate below on
  # the release's tag and pushes the package to NuGet.org, stamped with the tag's version.
  release:
    types: [published]
  workflow_dispatch:

# A newer event on the same PR, including `converted_to_draft`, cancels the PR's in-progress
# run. Push, release and dispatch runs get unique groups, so they never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

jobs:
  test:
    name: Test (${{ matrix.os }})
    # Draft PRs are reviewed before CI runs: skip before renting a runner. `ready_for_review`
    # starts this job; dependent jobs skip with it.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, ubuntu-24.04-arm]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-version: 11.0.100

      - name: Verify ARM64 runner
        if: matrix.os == 'ubuntu-24.04-arm'
        run: |
          test "$(uname -m)" = aarch64
          dotnet --info

      - name: Restore
        run: dotnet restore Reservoir.slnx

      - name: Build
        run: dotnet build Reservoir.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/Reservoir.Tests/Reservoir.Tests.csproj --configuration Release --no-build

      - name: Test netstandard2.0 build
        run: dotnet test tests/Reservoir.NetStandard.Tests/Reservoir.NetStandard.Tests.csproj --configuration Release --no-build

      - name: Test actual .NET Framework runtime
        if: runner.os == 'Windows'
        timeout-minutes: 2
        run: ./tests/Reservoir.Legacy.Tests/bin/Release/net48/Reservoir.Legacy.Tests.exe

  native-aot:
    name: NativeAOT Smoke
    # Draft PRs are reviewed before CI runs: skip before renting a runner. `ready_for_review`
    # starts this job; dependent jobs skip with it.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Publish
        run: >-
          dotnet publish tests/Reservoir.NativeAot.Tests/Reservoir.NativeAot.Tests.csproj
          --configuration Release
          --output artifacts/native-aot

      - name: Run
        run: ./artifacts/native-aot/Reservoir.NativeAot.Tests

  package:
    name: Pack
    needs: [test, native-aot]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # A published release takes its version from the release's tag, so editing the tag of the
      # draft release is how a version is chosen. Every other run uses the next patch after the
      # latest release tag (a CI prerelease off main).
      - name: Resolve package version
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          shopt -s inherit_errexit
          pwsh -NoProfile -File ./build/Test-PackageVersion.ps1
          # The script holds the one version grammar and rejects a tag that is not a version.
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            version=$(pwsh -NoProfile -File ./build/Get-PackageVersion.ps1 -ReleaseTag "$RELEASE_TAG")
          else
            version=$(pwsh -NoProfile -File ./build/Get-PackageVersion.ps1)
          fi
          if [ -z "$version" ]; then
            echo "::error::Get-PackageVersion.ps1 produced no version."
            exit 1
          fi
          echo "Version: $version"
          echo "PACKAGE_VERSION=$version" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # A release can only ship what main has: the tag must point at a commit on main.
      - name: Verify release commit is on main
        if: github.event_name == 'release'
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release $RELEASE_TAG points at $GITHUB_SHA, which is not on main."
            exit 1
          fi

      # The version comes from the environment the step above exported, not from interpolated
      # step outputs, so release-tag text never runs as shell.
      - name: Pack
        run: >-
          dotnet pack src/Reservoir/Reservoir.csproj
          --configuration Release
          --output artifacts/packages
          "-p:Version=$PACKAGE_VERSION"
          "-p:PackageVersion=$PACKAGE_VERSION"
          -p:ContinuousIntegrationBuild=true

      - name: Test package consumers
        run: >-
          dotnet build tests/Reservoir.Package.Consumer/Reservoir.Package.Consumer.csproj
          --configuration Release
          "-p:ReservoirPackageVersion=$PACKAGE_VERSION"
          "-p:RestoreAdditionalProjectSources=$GITHUB_WORKSPACE/artifacts/packages"

      - name: Test package contents and runtime compatibility
        run: >-
          RESERVOIR_PACKAGE_PATH="$GITHUB_WORKSPACE/artifacts/packages/Reservoir.$PACKAGE_VERSION.nupkg"
          dotnet test tests/Reservoir.Package.Tests/Reservoir.Package.Tests.csproj
          --configuration Release
          "-p:ReservoirPackageVersion=$PACKAGE_VERSION"
          "-p:RestoreAdditionalProjectSources=$GITHUB_WORKSPACE/artifacts/packages"

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: Reservoir-${{ steps.version.outputs.version }}
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: error

  # The `main` ruleset's required check: one result for every PR CI job, so auto-merge waits
  # for all of them. Every other PR job must be listed in `needs`, or its failure is invisible.
  ci-passed:
    # A draft run skips this job, and GitHub reports a job skipped by `if:` under its
    # unevaluated name expression, never as `CI Passed`, so a draft run cannot satisfy the
    # ruleset. A cancelled run skips it the same way. Failed or cancelled jobs fail it.
    name: ${{ github.event.pull_request.draft == false && 'CI Passed' || 'CI Passed (draft)' }}
    needs: [test, native-aot, package]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every CI job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null

  publish:
    name: Publish
    needs: package
    # Only a published GitHub release publishes. GitHub has already created the tag and the
    # release; this job pushes the package and attaches it to that release. Trusted publishing
    # (NuGet/login) is tied to this workflow file and the Production environment, so both stay.
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: Production
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Download package
        uses: actions/download-artifact@v8
        with:
          pattern: Reservoir-*
          path: artifacts/packages
          merge-multiple: true

      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet.org
        id: push
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          Get-ChildItem artifacts/packages/*.nupkg | ForEach-Object {
            dotnet nuget push $_.FullName `
              --source https://api.nuget.org/v3/index.json `
              --api-key $env:NUGET_API_KEY `
              --skip-duplicate
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      # The draft was named, and its compare link written, for the suggested version: follow the
      # tag if it was edited before publishing, and mark a prerelease tag (v2.0.0-beta.1) as a
      # GitHub prerelease. Runs once the package is on NuGet.org even if the asset upload failed,
      # and is cosmetic, so it never fails the release.
      - name: Name release after its tag
        if: ${{ !cancelled() && steps.push.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ github.event.release.id }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          shopt -s inherit_errexit
          version="${RELEASE_TAG#v}"
          prerelease=false
          if [[ "$version" == *-* ]]; then
            prerelease=true
          fi
          body=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq '.body // ""')
          # Only the generated "**Full Changelog**: .../compare/A...B" line; other links stay.
          body=$(printf '%s' "$body" | sed -E "/^\*\*Full Changelog\*\*: /s#(/compare/[^ )]+)\.\.\.[^ )]+#\1...$RELEASE_TAG#")
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -f name="$version" -f body="$body" -F prerelease="$prerelease" > /dev/null

      - name: Attach package to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" artifacts/packages/*.nupkg --repo "$GITHUB_REPOSITORY" --clobber
