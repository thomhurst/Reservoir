name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:
    inputs:
      publish-packages:
        description: Publish package to NuGet.org and create GitHub release?
        type: boolean
        required: true
        default: false

# A newer event on the same PR, including `converted_to_draft`, cancels the PR's in-progress
# run. Push and dispatch runs get unique groups, so they never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

jobs:
  test:
    name: Test (${{ matrix.os }})
    # Draft PRs are reviewed before CI runs: skip before renting a runner. `ready_for_review`
    # starts this job; dependent jobs skip with it.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, ubuntu-24.04-arm]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-version: 10.0.403

      - name: Verify ARM64 runner
        if: matrix.os == 'ubuntu-24.04-arm'
        run: |
          test "$(uname -m)" = aarch64
          dotnet --info

      - name: Restore
        run: dotnet restore Reservoir.slnx

      - name: Build
        run: dotnet build Reservoir.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/Reservoir.Tests/Reservoir.Tests.csproj --configuration Release --no-build

      - name: Test netstandard2.0 build
        run: dotnet test tests/Reservoir.NetStandard.Tests/Reservoir.NetStandard.Tests.csproj --configuration Release --no-build

      - name: Test actual .NET Framework runtime
        if: runner.os == 'Windows'
        timeout-minutes: 2
        run: ./tests/Reservoir.Legacy.Tests/bin/Release/net48/Reservoir.Legacy.Tests.exe

  native-aot:
    name: NativeAOT Smoke
    # Draft PRs are reviewed before CI runs: skip before renting a runner. `ready_for_review`
    # starts this job; dependent jobs skip with it.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Publish
        run: >-
          dotnet publish tests/Reservoir.NativeAot.Tests/Reservoir.NativeAot.Tests.csproj
          --configuration Release
          --output artifacts/native-aot

      - name: Run
        run: ./artifacts/native-aot/Reservoir.NativeAot.Tests

  package:
    name: Pack
    needs: [test, native-aot]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Generate package version
        id: version
        shell: pwsh
        run: |
          $version = ./build/Get-PackageVersion.ps1
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Pack
        run: >-
          dotnet pack src/Reservoir/Reservoir.csproj
          --configuration Release
          --output artifacts/packages
          -p:Version=${{ steps.version.outputs.version }}
          -p:PackageVersion=${{ steps.version.outputs.version }}
          -p:ContinuousIntegrationBuild=true

      - name: Test package consumers
        run: >-
          dotnet build tests/Reservoir.Package.Consumer/Reservoir.Package.Consumer.csproj
          --configuration Release
          -p:ReservoirPackageVersion=${{ steps.version.outputs.version }}
          -p:RestoreAdditionalProjectSources=${{ github.workspace }}/artifacts/packages

      - name: Test package contents and runtime compatibility
        env:
          RESERVOIR_PACKAGE_PATH: ${{ github.workspace }}/artifacts/packages/Reservoir.${{ steps.version.outputs.version }}.nupkg
        run: >-
          dotnet test tests/Reservoir.Package.Tests/Reservoir.Package.Tests.csproj
          --configuration Release
          -p:ReservoirPackageVersion=${{ steps.version.outputs.version }}
          -p:RestoreAdditionalProjectSources=${{ github.workspace }}/artifacts/packages

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: Reservoir-${{ steps.version.outputs.version }}
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: error

  # The `main` ruleset's required check: one result for every PR CI job, so auto-merge waits
  # for all of them. Every other PR job must be listed in `needs`, or its failure is invisible.
  ci-passed:
    # A draft run skips this job, and GitHub reports a job skipped by `if:` under its
    # unevaluated name expression, never as `CI Passed`, so a draft run cannot satisfy the
    # ruleset. A cancelled run skips it the same way. Failed or cancelled jobs fail it.
    name: ${{ github.event.pull_request.draft == false && 'CI Passed' || 'CI Passed (draft)' }}
    needs: [test, native-aot, package]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every CI job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null

  publish:
    name: Publish
    needs: package
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.publish-packages
    runs-on: ubuntu-latest
    environment: Production
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Download package
        uses: actions/download-artifact@v8
        with:
          pattern: Reservoir-*
          path: artifacts/packages
          merge-multiple: true

      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet.org
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          Get-ChildItem artifacts/packages/*.nupkg | ForEach-Object {
            dotnet nuget push $_.FullName `
              --source https://api.nuget.org/v3/index.json `
              --api-key $env:NUGET_API_KEY `
              --skip-duplicate
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $package = Get-ChildItem artifacts/packages/Reservoir.*.nupkg | Select-Object -First 1
          $version = $package.BaseName.Substring('Reservoir.'.Length)
          $tag = "v$version"

          gh release create $tag $package.FullName `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title $version `
            --generate-notes
