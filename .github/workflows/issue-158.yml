name: Issue 158 reproduction

on:
  push:
    branches: [issue-158-reproduction]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      DOTNET_TieredPGO: '1'
      KEVLAR_SHA: 801416a0e6f800b643cacacc402b45a42da48ad8
      CANDIDATE_VERSION: '1.6.10'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: reservoir
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: thomhurst/Kevlar
          ref: 801416a0e6f800b643cacacc402b45a42da48ad8
          path: kevlar
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: reservoir/global.json
      - name: Build fixed Kevlar baseline
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory evidence | Out-Null
          Copy-Item reservoir/diagnostics/issue-158/prior-evidence evidence -Recurse
          $packages = Join-Path $PWD 'kevlar/Directory.Packages.props'
          [xml] $xml = Get-Content $packages
          $package = $xml.Project.ItemGroup.PackageVersion | Where-Object Include -eq 'Reservoir'
          $package.Version = '[1.4.0]'
          $xml.Save($packages)
          & dotnet build kevlar/src/Kevlar/Kevlar.csproj -c Release -f net10.0 --disable-build-servers *> evidence/kevlar-build.log
          if ($LASTEXITCODE -ne 0) { Get-Content evidence/kevlar-build.log -Tail 80; exit 1 }
          $assets = Get-Content kevlar/artifacts/obj/Kevlar/project.assets.json -Raw | ConvertFrom-Json
          if ('Reservoir/1.4.0' -notin $assets.libraries.PSObject.Properties.Name) { throw 'Kevlar did not restore Reservoir 1.4.0.' }
          $dll = (Resolve-Path kevlar/artifacts/bin/Kevlar/release_net10.0/Kevlar.dll).Path
          "KEVLAR_DLL=$dll" >> $env:GITHUB_ENV
          Copy-Item kevlar/artifacts/obj/Kevlar/project.assets.json evidence/kevlar-assets.json
          git -C kevlar diff > evidence/kevlar-build.patch
          git -C reservoir rev-parse HEAD > evidence/harness-sha.txt
          git -C kevlar rev-parse HEAD > evidence/kevlar-sha.txt
          dotnet --info > evidence/dotnet-info.txt
          lscpu > evidence/cpu.txt
          Get-FileHash $dll | Format-List > evidence/kevlar-hash.txt
      - name: Build harness
        shell: pwsh
        run: |
          dotnet build reservoir/diagnostics/issue-158/Probe.csproj -c Release --disable-build-servers *> evidence/probe-build.log
          if ($LASTEXITCODE -ne 0) { Get-Content evidence/probe-build.log -Tail 80; exit 1 }
      - name: Dry validation then A-B-A measurement
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = (Resolve-Path evidence).Path
          Set-Location reservoir/diagnostics/issue-158
          @{ baseline = '1.4.0'; candidate = $env:CANDIDATE_VERSION } | ConvertTo-Json > (Join-Path $evidence 'versions.json')
          foreach ($phase in 'dry-baseline', 'dry-candidate', 'A-baseline', 'B-candidate', 'C-baseline') {
            $env:DIAG_PHASE = $phase
            $env:DIAG_DRY = if ($phase.StartsWith('dry')) { '1' } else { '0' }
            $env:DIAG_VERSION = if ($phase -in 'dry-candidate', 'B-candidate') { $env:CANDIDATE_VERSION } else { '1.4.0' }
            $output = Join-Path $evidence $phase
            Write-Host "Starting $phase at $([DateTime]::UtcNow.ToString('O'))"
            dotnet bin/Release/net10.0/Probe.dll --filter '*' --exporters json --join --disasm --disasmDepth 8 --artifacts $output --noOverwrite *> "$output.log"
            if ($LASTEXITCODE -ne 0) { Get-Content "$output.log" -Tail 100; exit 1 }
            Get-ChildItem $output -Recurse -Filter '*-report-github.md' | ForEach-Object { Get-Content $_ }
          }
          foreach ($version in '1.4.0', $env:CANDIDATE_VERSION) {
            Copy-Item "$env:HOME/.nuget/packages/reservoir/$version/reservoir.nuspec" (Join-Path $evidence "reservoir-$version.nuspec")
          }
      - name: Summarize and validate measurements
        shell: bash
        run: python reservoir/diagnostics/issue-158/summarize.py evidence | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: issue-158-evidence
          path: evidence/
          retention-days: 90
          if-no-files-found: error
